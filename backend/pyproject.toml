[project]
name = "tatpar"
version = "0.1.0"
description = "TATPAR — readiness assurance platform for air fleets (SIH 2026 PS 26249)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "shap>=0.45",
  "lifelines>=0.28",
  "ortools>=9.10",
  "pyarrow>=15",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tatpar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
