# Build data and models from public sources, then test the backend and drive the real UI end to end.
name: CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -q -e "backend[dev]"

      - name: Install frontend
        run: cd frontend && npm ci --no-audit --no-fund

      - name: Typecheck and build the UI
        run: cd frontend && npm run build

      - name: Data and models (NASA C-MAPSS, MaintNet, notional fleet)
        run: make train

      - name: Benchmarks (quick replications)
        run: cd backend && .venv/bin/python -m tatpar.pipelines.bench --quick

      - name: Backend tests
        run: make test

      - name: End-to-end smoke test
        run: |
          (cd backend && .venv/bin/python -m uvicorn tatpar.api.main:app --port 8000 > ../uvicorn.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 2; done
          cd frontend && npx playwright install --with-deps chromium && npm run e2e

      - name: Server log on failure
        if: failure()
        run: tail -100 uvicorn.log || true
