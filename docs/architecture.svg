<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#64748b}
      .w{font-size:13px;font-weight:700;fill:#ffffff}
      .ws{font-size:11.5px;fill:#e2e8f0}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#arr)}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <text x="40" y="44" font-size="24" font-weight="800" fill="#0f172a">TATPAR — Readiness Assurance Architecture</text>
  <text x="40" y="68" class="s">Integrate → Predict (calibrated) → Simulate (Fleet Twin) → Optimise → Assure → Learn · runs fully offline</text>

  <!-- Column headers -->
  <text x="40" y="110" class="h">SOURCES</text>
  <text x="250" y="110" class="h">1 · DATA FABRIC</text>
  <text x="500" y="110" class="h">2 · INTELLIGENCE</text>
  <text x="770" y="110" class="h">3 · FLEET TWIN  ⇄  4 · DECISION ENGINES</text>
  <text x="1090" y="110" class="h">5 · EXPERIENCE</text>

  <!-- Sources -->
  <g>
    <rect x="40" y="122" width="180" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="54" y="148" class="t">HUMS / ACMS</text><text x="54" y="168" class="s">engine &amp; system sensors</text>
    <rect x="40" y="194" width="180" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="54" y="220" class="t">Tech records</text><text x="54" y="240" class="s">e-MMS, snags, Form-700</text>
    <rect x="40" y="266" width="180" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="54" y="292" class="t">Spares ERP</text><text x="54" y="312" class="s">IMMOLS stock &amp; demands</text>
    <rect x="40" y="338" width="180" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="54" y="364" class="t">Repair agencies</text><text x="54" y="384" class="s">BRD / HAL status, TAT</text>
    <rect x="40" y="410" width="180" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="54" y="436" class="t">Flying programme</text><text x="54" y="456" class="s">task, mission mix, surge</text>
    <rect x="40" y="482" width="180" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="54" y="508" class="t">Environment</text><text x="54" y="528" class="s">CAMS dust, heat, altitude</text>
  </g>

  <!-- Data fabric -->
  <rect x="250" y="122" width="220" height="422" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="266" y="150" class="t">Common Data Model</text>
  <text x="266" y="170" class="s" font-size="11">S5000F · ATA iSpec 2200 · OSA-CBM</text>
  <rect x="266" y="186" width="188" height="46" rx="8" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="278" y="206" class="s" font-weight="700">Adapters</text><text x="278" y="223" class="s">CSV · HDF5 · API · MQTT</text>
  <rect x="266" y="242" width="188" height="46" rx="8" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="278" y="262" class="s" font-weight="700">Entity resolution</text><text x="278" y="279" class="s">tail · part no. · serial</text>
  <rect x="266" y="298" width="188" height="64" rx="8" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="278" y="318" class="s" font-weight="700">Unified graph</text><text x="278" y="335" class="s">Tail → System → LRU serial</text><text x="278" y="351" class="s">→ events → stock → pipeline</text>
  <rect x="266" y="372" width="188" height="46" rx="8" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="278" y="392" class="s" font-weight="700">Data-quality scores</text><text x="278" y="409" class="s">fresh · complete · consistent</text>
  <rect x="266" y="428" width="188" height="46" rx="8" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="278" y="448" class="s" font-weight="700">Lineage</text><text x="278" y="465" class="s">every number traceable</text>
  <rect x="266" y="484" width="188" height="46" rx="8" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="278" y="504" class="s" font-weight="700">Env. Severity Index</text><text x="278" y="521" class="s">per base</text>

  <!-- Intelligence -->
  <rect x="500" y="122" width="240" height="422" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="516" y="150" class="t">Calibrated Prognostics</text>
  <rect x="516" y="164" width="208" height="58" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="528" y="184" class="s" font-weight="700">Engine RUL + conformal</text><text x="528" y="201" class="s">90 % interval, module SHAP</text><text x="528" y="215" class="s" fill="#6d28d9">NASA C-MAPSS FD001–4</text>
  <rect x="516" y="230" width="208" height="58" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="528" y="250" class="s" font-weight="700">LRU survival (Weibull AFT)</text><text x="528" y="267" class="s">dust · heat · altitude · g-load</text><text x="528" y="281" class="s">P(fail in next h hours)</text>
  <rect x="516" y="296" width="208" height="58" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="528" y="316" class="s" font-weight="700">Leak detectors</text><text x="528" y="333" class="s">No-Fault-Found · rogue units</text><text x="528" y="347" class="s">chronic defects</text>
  <rect x="516" y="362" width="208" height="58" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="528" y="382" class="s" font-weight="700">Snag intelligence</text><text x="528" y="399" class="s">ATA auto-code · similar cases</text><text x="528" y="413" class="s">fix-effectiveness ranking</text>
  <rect x="516" y="428" width="208" height="102" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="528" y="448" class="s" font-weight="700">Federated learning</text><text x="528" y="465" class="s">bases train locally,</text><text x="528" y="481" class="s">share only model weights</text><text x="528" y="503" class="s" fill="#6d28d9">raw data never leaves base</text>

  <!-- Twin -->
  <rect x="770" y="122" width="290" height="140" rx="14" fill="#0f766e"/>
  <text x="786" y="150" class="w">FLEET TWIN — sustainment system</text>
  <text x="786" y="174" class="ws">aircraft states · installed LRU ages</text>
  <text x="786" y="194" class="ws">stock at squadron &amp; depot echelons</text>
  <text x="786" y="214" class="ws">BRD / HAL repair queues · bays · manpower</text>
  <text x="786" y="240" class="ws" font-weight="700">Monte-Carlo × 200 → P10–P90 readiness</text>

  <!-- Decision engines -->
  <rect x="770" y="284" width="290" height="260" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="786" y="310" class="t">Decision Engines</text>
  <rect x="786" y="322" width="258" height="40" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="798" y="347" class="s"><tspan font-weight="700">FMP (CP-SAT)</tspan> stagger · bundle · risk cap</text>
  <rect x="786" y="368" width="258" height="40" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="798" y="393" class="s"><tspan font-weight="700">RBS (VARI-METRIC)</tspan> prognostic demand</text>
  <rect x="786" y="414" width="258" height="40" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="798" y="439" class="s"><tspan font-weight="700">Transfers · Cannibalisation</tspan> advisor</text>
  <rect x="786" y="460" width="258" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="798" y="484" class="s" font-weight="700">Readiness-Backward Planner</text>
  <text x="798" y="502" class="s">"18 MC at Jodhpur on D+10"</text>
  <text x="798" y="519" class="s">→ actions + P(meet) gain</text>

  <!-- Experience -->
  <rect x="1090" y="122" width="160" height="422" rx="14" fill="#1e293b"/>
  <text x="1104" y="150" class="w">Command Centre</text>
  <text x="1104" y="178" class="ws">Readiness forecast</text>
  <text x="1104" y="200" class="ws">Readiness planner</text>
  <text x="1104" y="222" class="ws">Fleet flow / plan</text>
  <text x="1104" y="244" class="ws">Aircraft health</text>
  <text x="1104" y="266" class="ws">Sustainment</text>
  <text x="1104" y="288" class="ws">Loss waterfall</text>
  <text x="1104" y="310" class="ws">Snag intelligence</text>
  <text x="1104" y="332" class="ws">Data fabric</text>
  <text x="1104" y="354" class="ws">Models &amp; trust</text>
  <text x="1104" y="390" class="w">Copilot</text>
  <text x="1104" y="410" class="ws">offline, tool-using</text>
  <text x="1104" y="446" class="w">Personas</text>
  <text x="1104" y="466" class="ws">Commander · Sqn EO</text>
  <text x="1104" y="484" class="ws">Logistics · Depot</text>
  <text x="1104" y="502" class="ws">Analyst / Auditor</text>

  <!-- Arrows -->
  <path class="ln" d="M220 333 L246 333"/>
  <path class="ln" d="M470 333 L496 333"/>
  <path class="ln" d="M740 192 L766 192"/>
  <path class="ln" d="M740 420 L766 420"/>
  <path class="ln" d="M915 262 L915 280"/>
  <path class="ln" d="M935 280 L935 266"/>
  <path class="ln" d="M1060 333 L1086 333"/>
  <!-- feedback loop -->
  <path class="ln" d="M1170 544 L1170 600 L360 600 L360 548"/>
  <text x="560" y="592" class="s" font-weight="700" fill="#475569">human approval · outcomes feed back → models re-learn</text>

  <!-- Trust bar -->
  <rect x="40" y="630" width="1210" height="96" rx="14" fill="#ffffff" stroke="#94a3b8"/>
  <text x="60" y="660" class="t">6 · Trust &amp; Sovereignty</text>
  <text x="60" y="686" class="s">Offline Docker on CPU laptop / edge server · RBAC personas · human-in-the-loop approval · hash-chained audit log</text>
  <text x="60" y="706" class="s">Model cards with calibration &amp; data provenance · federated learning across bases · public + synthetic data only (no classified data)</text>
</svg>
